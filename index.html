<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.C.E.S. Email Auditor</title>
    <!-- Include marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f5f7;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 { color: #0052cc; }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        textarea, input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea { height: 120px; resize: vertical; }
        button {
            background-color: #0052cc;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:hover { background-color: #0047b3; }
        button:disabled { background-color: #999; cursor: not-allowed; }
        
        /* API Key Section Styling */
        .api-key-container {
            display: flex;
            gap: 10px;
        }
        #saveKeyBtn {
            width: auto;
            background-color: #28a745;
        }
        #saveKeyBtn:hover { background-color: #218838; }
        #keyStatus {
            font-size: 0.9em;
            color: #28a745;
            display: none;
            margin-top: 8px;
        }
        #keyStatus a { color: #dc3545; text-decoration: underline; cursor: pointer; margin-left: 10px; }

        /* Output & Table Styling */
        #outputArea {
            margin-top: 30px;
            padding: 25px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            display: none;
            line-height: 1.6;
        }
        #outputArea table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        #outputArea th, #outputArea td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        #outputArea th {
            background-color: #f8f9fa;
            font-weight: bold;
        }
        .loading { text-align: center; font-style: italic; color: #666; display: none; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>Advocate Email Auditor</h1>
    <p>Paste the case details below to audit and generate the best response.</p>

    <!-- API Key Section (Saved to Local Storage) -->
    <div class="form-group" id="apiKeySection">
        <label for="apiKey">Gemini API Key:</label>
        <div class="api-key-container" id="apiKeyInputs">
            <input type="password" id="apiKey" placeholder="AIzaSy...">
            <button id="saveKeyBtn" onclick="saveApiKey()">Save Key</button>
        </div>
        <div id="keyStatus">✅ API Key is saved in your browser. <a onclick="clearApiKey()">Clear Key</a></div>
    </div>

    <div class="form-group">
        <label for="conversation">Full Customer Conversation:</label>
        <textarea id="conversation" placeholder="Paste the full email thread or chat transcript here..."></textarea>
    </div>

    <div class="form-group">
        <label for="reference">Case Reason / Help Center Link:</label>
        <input type="text" id="reference" placeholder="e.g., W-2 Corrections or https://support.gusto.com/...">
    </div>

    <div class="form-group">
        <label for="draft">Agent's Current Draft:</label>
        <textarea id="draft" placeholder="Paste your current draft email here..."></textarea>
    </div>

    <button id="submitBtn" onclick="runAudit()">Audit & Rewrite Email</button>
    <div id="loading" class="loading">Auditing draft against A.C.E.S. framework...</div>

    <div id="outputArea"></div>

    <script>
        const SYSTEM_PROMPT = `You are the Advocate Email Auditor, an automated tool for improving customer service emails based on the A.C.E.S. Framework. 
        
Your Mission: Audit the provided draft email against the customer conversation and reference material. 
Output exactly two things:
1. A markdown table grading the draft against the A.C.E.S framework.
2. A suggested revised draft that implements all feedback, acts on behalf of the customer where possible, and addresses the core issue.

Follow flexible guardrails: Anonymize PII, prioritize official Gusto links, focus on root cause, and minimize customer "homework" unless necessary.`;

        // Initialize UI based on saved API Key
        document.addEventListener("DOMContentLoaded", () => {
            const savedKey = localStorage.getItem('geminiApiKey');
            if (savedKey) {
                document.getElementById('apiKeyInputs').style.display = 'none';
                document.getElementById('keyStatus').style.display = 'block';
            }
        });

        function saveApiKey() {
            const key = document.getElementById('apiKey').value.trim();
            if (key) {
                localStorage.setItem('geminiApiKey', key);
                document.getElementById('apiKeyInputs').style.display = 'none';
                document.getElementById('keyStatus').style.display = 'block';
            } else {
                alert("Please enter a valid API key.");
            }
        }

        function clearApiKey() {
            localStorage.removeItem('geminiApiKey');
            document.getElementById('apiKey').value = '';
            document.getElementById('apiKeyInputs').style.display = 'flex';
            document.getElementById('keyStatus').style.display = 'none';
        }

        async function runAudit() {
            const apiKey = localStorage.getItem('geminiApiKey');
            const conversation = document.getElementById('conversation').value.trim();
            const reference = document.getElementById('reference').value.trim();
            const draft = document.getElementById('draft').value.trim();
            const outputArea = document.getElementById('outputArea');
            const loading = document.getElementById('loading');
            const submitBtn = document.getElementById('submitBtn');

            if (!apiKey) {
                alert("Please enter and save your Gemini API Key first.");
                document.getElementById('apiKey').focus();
                return;
            }

            if (!conversation || !draft) {
                alert("Please provide the Conversation and a Draft.");
                return;
            }

            const finalPrompt = `${SYSTEM_PROMPT}\n\n--- INPUT DATA ---\n\nCUSTOMER CONVERSATION:\n${conversation}\n\nREFERENCE LINK/REASON:\n${reference}\n\nAGENT DRAFT:\n${draft}`;

            // UI State updates
            submitBtn.disabled = true;
            loading.style.display = 'block';
            outputArea.style.display = 'none';
            outputArea.innerHTML = '';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: finalPrompt }] }],
                        generationConfig: { temperature: 0.4 }
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                const resultText = data.candidates[0].content.parts[0].text;
                
                // Parse the Markdown to HTML using marked.js
                outputArea.innerHTML = marked.parse(resultText);
                outputArea.style.display = 'block';

            } catch (error) {
                outputArea.innerHTML = `<span style="color: red;"><strong>Error:</strong> ${error.message}</span>`;
                outputArea.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
