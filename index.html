<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.C.E.S. Email Auditor</title>
    <!-- Include marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f5f7;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 { color: #0052cc; }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        textarea, input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
        }
        textarea { height: 120px; resize: vertical; }
        
        .model-container {
            display: flex;
            gap: 10px;
        }
        
        button {
            background-color: #0052cc;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:hover { background-color: #0047b3; }
        button:disabled { background-color: #999; cursor: not-allowed; }
        
        #fetchModelsBtn {
            width: auto;
            background-color: #172b4d;
            white-space: nowrap;
        }
        #fetchModelsBtn:hover { background-color: #091e42; }

        /* Output & Table Styling */
        #outputArea {
            margin-top: 30px;
            padding: 25px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            display: none;
            line-height: 1.6;
        }
        #outputArea table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        #outputArea th, #outputArea td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        #outputArea th {
            background-color: #f8f9fa;
            font-weight: bold;
        }
        .loading { text-align: center; font-style: italic; color: #666; display: none; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>Advocate Email Auditor</h1>
    <p>Paste the case details below to audit and generate the best response.</p>

    <div class="form-group">
        <label for="modelSelect">AI Model:</label>
        <div class="model-container">
            <select id="modelSelect">
                <option value="models/gemini-3.5-flash">models/gemini-3.5-flash (Default)</option>
            </select>
            <button id="fetchModelsBtn" onclick="fetchModels()">Fetch Models</button>
        </div>
    </div>

    <div class="form-group">
        <label for="conversation">Full Customer Conversation:</label>
        <textarea id="conversation" placeholder="Paste the full email thread or chat transcript here..."></textarea>
    </div>

    <div class="form-group">
        <label for="reference">Case Reason / Help Center Link:</label>
        <input type="text" id="reference" placeholder="e.g., W-2 Corrections or https://support.gusto.com/...">
    </div>

    <div class="form-group">
        <label for="draft">Agent's Current Draft:</label>
        <textarea id="draft" placeholder="Paste your current draft email here..."></textarea>
    </div>

    <button id="submitBtn" onclick="runAudit()">Audit & Rewrite Email</button>
    <div id="loading" class="loading">Auditing draft against A.C.E.S. framework...</div>

    <div id="outputArea"></div>

    <script>
        const SYSTEM_PROMPT = `You are the Advocate Email Auditor, an automated tool for improving customer service emails based on the A.C.E.S. Framework. 
        
Your Mission: Audit the provided draft email against the customer conversation and reference material. 
Output exactly two things:
1. A markdown table grading the draft against the A.C.E.S framework.
2. A suggested revised draft that implements all feedback.

CRITICAL GUARDRAIL - RESOLUTION FIDELITY: 
Do NOT invent, assume, or jump to resolutions that are not explicitly outlined in the agent's draft or the provided reference link. Preserve the full context and original goal of the draft. You may offer suggestions to improve the resolution's clarity, formatting, or tone, but you must not alter the core solution the agent has chosen.

Follow flexible guardrails: Anonymize PII, prioritize official Gusto links, focus on root cause, and minimize customer "homework" unless necessary.`;

        // Corrected Obfuscated API Key retrieval
        function _gK() {
            const _0x1 = "QVEuQWI4Uk42TE";
            const _0x2 = "hSN2Rhd3IyUlBS";
            const _0x3 = "UXU2Q1RPX0Yybn";
            const _0x4 = "FlMVNvcG1UUkc2";
            const _0x5 = "cmNKVHZJY2I3U1E=";
            return atob(_0x1 + _0x2 + _0x3 + _0x4 + _0x5);
        }

        // Fetch available models manually
        async function fetchModels() {
            const modelSelect = document.getElementById('modelSelect');
            const fetchBtn = document.getElementById('fetchModelsBtn');
            
            fetchBtn.disabled = true;
            fetchBtn.textContent = "Fetching...";
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${_gK()}`);
                const data = await response.json();
                
                if (data.error) throw new Error(data.error.message);

                // Filter for models that support text generation
                const generativeModels = data.models.filter(m => 
                    m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent')
                );

                modelSelect.innerHTML = ''; // Clear existing options

                generativeModels.forEach(model => {
                    const option = document.createElement('option');
                    option.value = model.name; 
                    option.textContent = model.displayName || model.name.replace('models/', '');
                    
                    // Auto-select 3.5 flash if it exists
                    if (model.name.includes('gemini-3.5-flash')) {
                        option.selected = true;
                    }
                    
                    modelSelect.appendChild(option);
                });

                if (modelSelect.options.length === 0) throw new Error("No generative models found.");
                
                fetchBtn.textContent = "Success!";
                setTimeout(() => { fetchBtn.textContent = "Fetch Models"; fetchBtn.disabled = false; }, 2000);

            } catch (error) {
                console.error("Error fetching models:", error);
                alert("Failed to fetch models: " + error.message);
                fetchBtn.textContent = "Fetch Failed";
                setTimeout(() => { fetchBtn.textContent = "Fetch Models"; fetchBtn.disabled = false; }, 2000);
            }
        }

        // Auto-fetch on load
        document.addEventListener("DOMContentLoaded", fetchModels);

        async function runAudit() {
            const selectedModel = document.getElementById('modelSelect').value;
            const conversation = document.getElementById('conversation').value.trim();
            const reference = document.getElementById('reference').value.trim();
            const draft = document.getElementById('draft').value.trim();
            const outputArea = document.getElementById('outputArea');
            const loading = document.getElementById('loading');
            const submitBtn = document.getElementById('submitBtn');

            if (!conversation || !draft) {
                alert("Please provide the Conversation and a Draft.");
                return;
            }

            const finalPrompt = `${SYSTEM_PROMPT}\n\n--- INPUT DATA ---\n\nCUSTOMER CONVERSATION:\n${conversation}\n\nREFERENCE LINK/REASON:\n${reference}\n\nAGENT DRAFT:\n${draft}`;

            // UI State updates
            submitBtn.disabled = true;
            loading.style.display = 'block';
            outputArea.style.display = 'none';
            outputArea.innerHTML = '';

            try {
                // Fetch request using the dynamically selected model
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${selectedModel}:generateContent?key=${_gK()}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: finalPrompt }] }],
                        generationConfig: { temperature: 0.4 }
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                const resultText = data.candidates[0].content.parts[0].text;
                
                // Parse the Markdown to HTML using marked.js
                outputArea.innerHTML = marked.parse(resultText);
                outputArea.style.display = 'block';

            } catch (error) {
                outputArea.innerHTML = `<span style="color: red;"><strong>Error:</strong> ${error.message}</span>`;
                outputArea.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
